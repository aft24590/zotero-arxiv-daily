name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore arXiv checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .arxiv-state.json
          key: arxiv-seen-${{ github.run_id }}
          restore-keys: |
            arxiv-seen-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          ARXIV_STATE_PATH: .arxiv-state.json
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Save arXiv checkpoint
        uses: actions/cache/save@v4
        with:
          path: .arxiv-state.json
          key: arxiv-seen-${{ github.run_id }}
