name: Cleanup old diagnostic runs (temporary)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-old-diagnostic-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.repository == 'aft24590/zotero-arxiv-daily'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove only five verified historical diagnostic runs
        shell: bash
        run: |
          set -euo pipefail
          while read -r id expected_workflow_id; do
            actual_workflow_id="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.workflow_id')"
            if [[ "$actual_workflow_id" != "$expected_workflow_id" ]]; then
              echo "::error::Unexpected workflow for run $id; refusing deletion."
              exit 1
            fi
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id"
            echo "Deleted historical diagnostic run $id"
          done <<'RUN_IDS'
          36100156082 366695284
          36100100957 366694954
          36100025550 366694456
          36018482174 366176253
          36018319417 366176253
          RUN_IDS
